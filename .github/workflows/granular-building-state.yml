name: Granular building state

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/granular-building-state.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prepare patch
        shell: bash
        run: |
          cat > /tmp/patch.py <<'PY'
          from pathlib import Path
          import sys

          p = Path(sys.argv[1])
          s = p.read_text(encoding='utf-8')

          def rep(old, new):
              global s
              if old not in s:
                  raise SystemExit('Anchor not found: ' + old[:120])
              s = s.replace(old, new, 1)

          rep('''    eta: [\n      {t:"1 – 20 anni",   ottimo:0.00, normale:0, scadente:-0.05},\n      {t:"20 – 40 anni",  ottimo:0.05, normale:0, scadente:-0.10},\n      {t:"Oltre 40 anni", ottimo:0.10, normale:0, scadente:-0.15}\n    ],\n    statoedificio: [\n      {t:"Ottimo stato", k:"ottimo"},\n      {t:"Normale",      k:"normale"},\n      {t:"Scadente",     k:"scadente"}\n    ],''', '''    eta: [\n      {t:"1 – 20 anni",   eccellente:0.03, ottimo:0.02, buono:0.01, normale:0.00, mediocre:-0.025, scadente:-0.05},\n      {t:"20 – 40 anni",  eccellente:0.05, ottimo:0.03, buono:0.01, normale:0.00, mediocre:-0.05,  scadente:-0.10},\n      {t:"Oltre 40 anni", eccellente:0.10, ottimo:0.07, buono:0.03, normale:0.00, mediocre:-0.075, scadente:-0.15}\n    ],\n    statoedificio: [\n      {t:"Eccellente — parti comuni appena riqualificate", k:"eccellente", n:"Facciate, tetto, scale, impianti e parti comuni recentemente rifatti o in condizioni paragonabili al nuovo."},\n      {t:"Ottimo — molto ben mantenuto",                   k:"ottimo",     n:"Parti comuni curate, nessun intervento rilevante prevedibile a breve."},\n      {t:"Buono — usura lieve",                            k:"buono",      n:"Edificio complessivamente sano, con normali segni d'uso e piccoli interventi non urgenti."},\n      {t:"Normale — manutenzione ordinaria",               k:"normale",    n:"Condizioni coerenti con età e tipologia, senza particolari pregi o criticità."},\n      {t:"Mediocre — manutenzioni visibili da fare",       k:"mediocre",   n:"Parti comuni trascurate o lavori prevedibili, ma senza degrado strutturale evidente."},\n      {t:"Scadente — degrado o lavori importanti",         k:"scadente",   n:"Degrado marcato o interventi rilevanti su facciate, coperture, impianti o parti comuni."}\n    ],''')

          rep('''    <div class="campo">\n      <label for="statoedificio">Stato edificio</label>\n      <select id="statoedificio"></select>\n    </div>''', '''    <div class="campo">\n      <label for="statoedificio">Stato edificio</label>\n      <select id="statoedificio"></select>\n      <div class="aiuto" id="nota-edificio"></div>\n    </div>''')

          rep('''  var SELECTS = ["piano","conservazione","luminosita","vista","eta","statoedificio","riscaldamento","parcheggio","locativo"];\n  SELECTS.forEach(function(k){ riempi($(k), T[k]); });''', '''  var SELECTS = ["piano","conservazione","luminosita","vista","eta","statoedificio","riscaldamento","parcheggio","locativo"];\n  SELECTS.forEach(function(k){ riempi($(k), T[k]); });\n\n  function migraStatoEdificio(s){\n    if(!s) return s;\n    if((s.versioneModello || 1) < 2){\n      var vecchi = {0:1, 1:3, 2:5}; // ottimo→ottimo, normale→normale, scadente→scadente\n      if(vecchi[s.statoedificio] != null) s.statoedificio = vecchi[s.statoedificio];\n      s.versioneModello = 2;\n    }\n    return s;\n  }''')

          rep('''  $("vista").value = 2; $("eta").value = 1; $("statoedificio").value = 2;''', '''  $("vista").value = 2; $("eta").value = 1; $("statoedificio").value = 5;''')

          rep('''  function leggiStato(){\n    var s = {''', '''  function leggiStato(){\n    var s = { versioneModello:2,''')

          rep('''  function scriviStato(s){\n    $("nome").value = s.nome || "";''', '''  function scriviStato(s){\n    s = migraStatoEdificio(s);\n    $("nome").value = s.nome || "";''')

          rep('''      .then(function(t){ archivio = t ? JSON.parse(t) : []; })''', '''      .then(function(t){ archivio = t ? JSON.parse(t).map(migraStatoEdificio) : []; })''')

          rep('''    $("eta").value = 0; $("statoedificio").value = 1; $("riscaldamento").value = 2;''', '''    $("eta").value = 0; $("statoedificio").value = 3; $("riscaldamento").value = 2;''')

          rep('''    $("nota-luce").textContent = T.luminosita[+$("luminosita").value].n;''', '''    $("nota-luce").textContent = T.luminosita[+$("luminosita").value].n;\n    $("nota-edificio").textContent = T.statoedificio[+$("statoedificio").value].n;''')

          p.write_text(s, encoding='utf-8')
          PY

      - name: Patch main
        shell: bash
        run: |
          python /tmp/patch.py index.html
          rm -f .github/workflows/granular-building-state.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html .github/workflows/granular-building-state.yml
          git commit -m "Make building condition more granular"
          git push origin main

      - name: Patch gh-pages
        shell: bash
        run: |
          git fetch origin gh-pages
          git checkout gh-pages
          python /tmp/patch.py index.html
          git add index.html
          git commit -m "Publish granular building condition"
          git push origin gh-pages
