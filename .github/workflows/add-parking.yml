name: Apply parking selector

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/add-parking.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prepare patch script
        shell: bash
        run: |
          cat > /tmp/patch.py <<'PY'
          from pathlib import Path
          import sys

          p = Path(sys.argv[1])
          s = p.read_text(encoding='utf-8')

          def rep(old, new):
              global s
              if old not in s:
                  raise SystemExit('Anchor not found: ' + old[:80])
              s = s.replace(old, new, 1)

          rep('''  <div class="campo">\n    <label for="locativo">Stato locativo</label>\n    <select id="locativo"></select>\n  </div>''', '''  <div class="campo">\n    <label for="parcheggio">Parcheggio</label>\n    <select id="parcheggio"></select>\n    <div class="aiuto">Usa questa voce per la comodità di parcheggio. Se box o posto auto sono già inseriti tra le superfici accessorie, mantieni un coefficiente prudente per evitare doppi conteggi.</div>\n  </div>\n  <div class="campo">\n    <label for="locativo">Stato locativo</label>\n    <select id="locativo"></select>\n  </div>''')

          rep('''    riscaldamento: [\n      {t:"Autonomo",                           v: 0.05},\n      {t:"Centralizzato con contabilizzatore", v: 0.02},\n      {t:"Centralizzato",                      v: 0.00},\n      {t:"Assente",                            v:-0.05}\n    ],\n    locativo: [''', '''    riscaldamento: [\n      {t:"Autonomo",                           v: 0.05},\n      {t:"Centralizzato con contabilizzatore", v: 0.02},\n      {t:"Centralizzato",                      v: 0.00},\n      {t:"Assente",                            v:-0.05}\n    ],\n    parcheggio: [\n      {t:"Neutro / già valorizzato nella superficie", v: 0.00},\n      {t:"Nessun posto privato, parcheggio facile",   v: 0.00},\n      {t:"Nessun posto privato, parcheggio difficile",v:-0.03},\n      {t:"Nessun posto privato, parcheggio molto difficile", v:-0.05},\n      {t:"Posto condominiale non assegnato",          v: 0.01},\n      {t:"Posto auto scoperto esclusivo",              v: 0.02},\n      {t:"Posto auto coperto esclusivo",               v: 0.03},\n      {t:"Box / garage esclusivo",                      v: 0.04},\n      {t:"Due o più posti / box",                       v: 0.05}\n    ],\n    locativo: [''')

          rep('var SELECTS = ["piano","conservazione","luminosita","vista","eta","statoedificio","riscaldamento","locativo"];', 'var SELECTS = ["piano","conservazione","luminosita","vista","eta","statoedificio","riscaldamento","parcheggio","locativo"];')
          rep('$("riscaldamento").value = 0; $("locativo").value = 0;', '$("riscaldamento").value = 0; $("parcheggio").value = 0; $("locativo").value = 0;')
          rep('''    v.push({t:"Riscaldamento", d:T.riscaldamento[s.riscaldamento].t, c:T.riscaldamento[s.riscaldamento].v});\n    v.push({t:"Stato locativo", d:T.locativo[s.locativo].t, c:T.locativo[s.locativo].v});''', '''    v.push({t:"Riscaldamento", d:T.riscaldamento[s.riscaldamento].t, c:T.riscaldamento[s.riscaldamento].v});\n    v.push({t:"Parcheggio", d:T.parcheggio[s.parcheggio].t, c:T.parcheggio[s.parcheggio].v});\n    v.push({t:"Stato locativo", d:T.locativo[s.locativo].t, c:T.locativo[s.locativo].v});''')
          rep('''    $("eta").value = 0; $("statoedificio").value = 1; $("riscaldamento").value = 2;\n    $("locativo").value = 0; $("extra").value = 0;''', '''    $("eta").value = 0; $("statoedificio").value = 1; $("riscaldamento").value = 2;\n    $("parcheggio").value = 0; $("locativo").value = 0; $("extra").value = 0;''')
          rep('''    <p><strong>Doppio conteggio.</strong> «Da ristrutturare» e «edificio scadente» descrivono in parte lo stesso difetto, così come luminosità ed esposizione. Sono voci separate perché così stanno nelle tue tabelle, ma sommandole rischi di penalizzare due volte la stessa cosa.</p>''', '''    <p><strong>Doppio conteggio.</strong> «Da ristrutturare» e «edificio scadente» descrivono in parte lo stesso difetto, così come luminosità ed esposizione. Sono voci separate perché così stanno nelle tue tabelle, ma sommandole rischi di penalizzare due volte la stessa cosa. Lo stesso vale per il parcheggio: se box o posto auto sono già valorizzati come superficie accessoria, usa il coefficiente parcheggio solo per rappresentare la comodità o difficoltà residua, non per attribuire di nuovo l'intero valore della pertinenza.</p>''')

          p.write_text(s, encoding='utf-8')
          PY

      - name: Patch main
        shell: bash
        run: |
          python /tmp/patch.py index.html
          rm -f .github/workflows/add-parking.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html .github/workflows/add-parking.yml
          git commit -m "Add parking coefficient selector"
          git push origin main

      - name: Patch gh-pages
        shell: bash
        run: |
          git fetch origin gh-pages
          git checkout gh-pages
          python /tmp/patch.py index.html
          git add index.html
          git commit -m "Publish parking coefficient selector"
          git push origin gh-pages
